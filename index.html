<html lang="zh-CN">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海阔天空（俄语版） Рождён для свободы</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--primary:#0f172a;--bg:linear-gradient(135deg,#232526 0%, #414345 100%);--glass:rgba(255,255,255,.08);--border:rgba(255,255,255,.15)}*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px 12px}
.player{background:var(--glass);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border:1px solid var(--border);border-radius:20px;padding:26px 24px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(31,38,135,.37);text-align:center;color:#fff}
.disc{width:160px;height:160px;margin:0 auto 18px;border-radius:50%;overflow:hidden;border:4px solid rgba(255,255,255,.3);box-shadow:0 0 20px rgba(0,0,0,.3)}
.disc img{width:100%;height:100%;object-fit:cover;object-position:center;animation:rot 20s linear infinite;animation-play-state:paused}
.player.playing .disc img{animation-play-state:running}
@keyframes rot{to{transform:rotate(360deg)}}
h2{font-size:20px;margin-bottom:20px;font-weight:600}
.ru{font-size:13px;opacity:.7;font-weight:400;margin-left:8px}
.progress-container{background:rgba(255,255,255,.3);border-radius:5px;cursor:pointer;height:6px;width:100%;margin:10px 0 8px;position:relative;touch-action:none}
.progress{background:var(--primary);border-radius:5px;height:100%;width:0%;position:relative}
.progress::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%) scale(0);width:13px;height:13px;background:#fff;border-radius:50%;box-shadow:0 0 6px rgba(0,0,0,.4);transition:transform .15s}
.progress-container:hover .progress::after,.progress-container.dragging .progress::after{transform:translateY(-50%) scale(1)}
.time-box{display:flex;justify-content:space-between;font-size:12px;opacity:.8;margin-bottom:18px}
.navigation{display:flex;justify-content:center;align-items:center;gap:16px}
.btn{background:none;border:none;cursor:pointer;color:#fff;font-size:18px;transition:transform .2s,color .2s;outline:none}
.btn:hover{color:var(--primary);transform:scale(1.1)}
.btn-big{font-size:32px;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;justify-content:center;align-items:center;box-shadow:0 4px 15px rgba(0,0,0,.2)}
.btn-big:hover{background:rgba(255,255,255,.2);color:#fff}
.lyrics-container{margin-top:20px;height:130px;position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
.lyrics-scroll{height:100%;overflow-y:auto;position:relative;scrollbar-width:none;padding:10px 5px}
.lyrics-scroll::-webkit-scrollbar{display:none}
.lyrics-scroll p{margin:9px 0;font-size:13px;opacity:.5;line-height:1.6;transition:all .3s}
.lyrics-scroll p.active{opacity:1;color:var(--primary);font-size:15px;font-weight:600}
@media (max-width:400px){.player{padding:20px 14px}.disc{width:130px;height:130px}.btn-big{width:52px;height:52px;font-size:28px}.navigation{gap:12px}}
</style>
</head>
<body>
<div class="player" id="player">
  <div class="disc" id="disc"><img id="cover" src="" alt="封面"></div>
  <h2><span id="title"></span><span id="ruTitle" class="ru"></span></h2>
  <audio id="audio"></audio>
  <div class="progress-container" id="progressContainer"><div class="progress" id="progress"></div></div>
  <div class="time-box"><span id="currTime">0:00</span><span id="durTime">0:00</span></div>
  <div class="navigation">
    <button id="prev" class="btn" title="重头播放"><i class="fas fa-backward"></i></button>
    <button id="play" class="btn btn-big"><i class="fas fa-play"></i></button>
    <button id="next" class="btn" title="重头播放"><i class="fas fa-forward"></i></button>
    <button id="volumeBtn" class="btn"><i class="fas fa-volume-up"></i></button>
  </div>
  <div class="lyrics-container" id="lyricsBox" style="display:none">
    <div class="lyrics-scroll" id="lyricsScroll"></div>
  </div>
</div>

/* ╚════════════════ 配置区结束 ═════════════════════╝ */

const $=id=>document.getElementById(id);
const player=$('player'),playBtn=$('play'),prevBtn=$('prev'),nextBtn=$('next'),
audio=$('audio'),progress=$('progress'),pBar=$('progressContainer'),
titleEl=$('title'),ruEl=$('ruTitle'),coverEl=$('cover'),discEl=$('disc'),
currEl=$('currTime'),durEl=$('durTime'),volBtn=$('volumeBtn'),
lyricsBox=$('lyricsBox'),lyricsScroll=$('lyricsScroll');

const strip=s=>(s||'').replace(/\s/g,'');
function normMusic(s){s=strip(s);if(!s)return'';
  // 如果是外部文件路径（mp3/wav/ogg等）或http链接，直接返回，不加Base64前缀
  if(s.startsWith('data:')||s.startsWith('http')||s.match(/\.(mp3|wav|ogg)$/i)) return s;
  // 否则当作Base64纯字符串处理，加上前缀
  return 'data:audio/mp3;base64,'+s;
}
function detectImg(b){
  if(b.startsWith('iVBORw0KGgo'))return'image/png';
  if(b.startsWith('/9j/'))return'image/jpeg';
  if(b.startsWith('R0lGOD'))return'image/gif';
  if(b.startsWith('Qk'))return'image/bmp';
  return'image/webp';
}
function normCover(s){s=strip(s);if(!s)return'';
  // 如果是外部文件路径（常见图片格式）或http链接，直接返回
  if(s.startsWith('data:')||s.startsWith('http')||s.match(/\.(webp|jpg|jpeg|png|gif|bmp)$/i)) return s;
  // 否则当作Base64纯字符串处理
  return 'data:'+detectImg(s)+';base64,'+s;
}
function fmt(t){if(!isFinite(t))return'0:00';const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0');}

/* 初始化 */
const musicSrc=normMusic(SONG.music);
if(musicSrc){audio.src=musicSrc;audio.loop=true;} /* 单曲循环：后台强制开启 */
const coverSrc=normCover(SONG.cover);
if(coverSrc){coverEl.src=coverSrc;}else{discEl.style.display='none';} /* 无封面则隐藏唱片 */
titleEl.textContent=SONG.title||'';
ruEl.textContent=SONG.ruTitle||'';
document.title=(SONG.title||'')+(SONG.ruTitle?' '+SONG.ruTitle:'');

/* ---------- 歌词解析与滚动 ---------- */
let lines=[],lineEls=[],timed=false,curLine=-1;
function parseLyrics(text){
  const out=[];
  (text||'').split(/\r?\n/).forEach(raw=>{
    const line=raw.trim();if(!line)return;
    const re=/\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;const ts=[];let m;
    while((m=re.exec(line))){const ms=m[3]?parseInt((m[3]+'000').slice(0,3),10):0;ts.push(+m[1]*60+ +m[2]+ms/1000);}
    const txt=line.replace(/\[[^\]]*\]/g,'').trim();
    if(ts.length)ts.forEach(t=>out.push({time:t,text:txt||'♪'}));
    else if(txt)out.push({time:null,text:txt});
  });
  const t=out.filter(l=>l.time!==null);
  return t.length?{lines:t.sort((a,b)=>a.time-b.time),timed:true}:{lines:out,timed:false};
}
function renderLyrics(text){
  const r=parseLyrics(text);lines=r.lines;timed=r.timed;curLine=-1;
  lyricsScroll.innerHTML='';lineEls=[];
  if(!lines.length){lyricsBox.style.display='none';return;}
  lyricsBox.style.display='block';
  lines.forEach(l=>{const p=document.createElement('p');p.textContent=l.text;lyricsScroll.appendChild(p);lineEls.push(p);});
}
renderLyrics(SONG.lyrics);
function syncLyrics(){
  if(!timed||!lines.length)return;
  const t=audio.currentTime;let idx=-1;
  for(let i=0;i<lines.length;i++){if(lines[i].time<=t)idx=i;else break;}
  if(idx===curLine)return;
  if(curLine>=0&&lineEls[curLine])lineEls[curLine].classList.remove('active');
  curLine=idx;
  if(idx>=0){const el=lineEls[idx];el.classList.add('active');
    lyricsScroll.scrollTo({top:el.offsetTop-lyricsScroll.clientHeight/2+el.clientHeight/2,behavior:'smooth'});}
}

/* ---------- 播放控制 ---------- */
function togglePlay(){
  if(!musicSrc){alert('请先在代码顶部 SONG.music 中粘贴歌曲的 Base64！');return;}
  if(audio.paused){audio.play();player.classList.add('playing');playBtn.innerHTML='<i class="fas fa-pause"></i>';}
  else{audio.pause();player.classList.remove('playing');playBtn.innerHTML='<i class="fas fa-play"></i>';}
}
playBtn.addEventListener('click',togglePlay);
prevBtn.addEventListener('click',()=>{audio.currentTime=0;if(audio.paused)togglePlay();});
nextBtn.addEventListener('click',()=>{audio.currentTime=0;if(audio.paused)togglePlay();});
volBtn.addEventListener('click',()=>{audio.muted=!audio.muted;volBtn.innerHTML=audio.muted?'<i class="fas fa-volume-mute"></i>':'<i class="fas fa-volume-up"></i>';});

/* ---------- 进度条拖拽 ---------- */
let dragging=false,dragPct=0;
const pctFrom=e=>{const r=pBar.getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));};
pBar.addEventListener('pointerdown',e=>{dragging=true;pBar.classList.add('dragging');pBar.setPointerCapture(e.pointerId);dragPct=pctFrom(e);progress.style.width=dragPct*100+'%';});
pBar.addEventListener('pointermove',e=>{if(!dragging)return;dragPct=pctFrom(e);progress.style.width=dragPct*100+'%';});
pBar.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;pBar.classList.remove('dragging');if(isFinite(audio.duration))audio.currentTime=dragPct*audio.duration;});

/* ---------- 时间同步 ---------- */
audio.addEventListener('timeupdate',()=>{
  if(!dragging&&isFinite(audio.duration)&&audio.duration>0)progress.style.width=(audio.currentTime/audio.duration*100)+'%';
  currEl.textContent=fmt(audio.currentTime);
  syncLyrics();
});
audio.addEventListener('loadedmetadata',()=>{durEl.textContent=fmt(audio.duration);});
document.body.addEventListener('keyup',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();togglePlay();}});
</script>
</body>
